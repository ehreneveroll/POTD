<script>
if(!window.storage){
  window.storage={
    async get(k){const v=localStorage.getItem(k);if(v===null)throw new Error("not found");return{key:k,value:v,shared:false};},
    async set(k,v){localStorage.setItem(k,v);return{key:k,value:v,shared:false};},
    async delete(k){localStorage.removeItem(k);return{key:k,deleted:true,shared:false};},
    async list(p){const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!p||k.startsWith(p))keys.push(k);}return{keys,shared:false};}
  };
}
</script>

/* ── FIX 1: Snow — removed opacity from keyframe so inline opacity is respected ── */
const Snow = memo(({ isDark }) => {
  const flakes = useRef(Array.from({length:18},(_,i)=>({
    id:i,
    left:parseFloat(((i/18)*100+(Math.random()-.5)*4).toFixed(2)),
    size:parseFloat((1.8+Math.random()*4.5).toFixed(1)),
    dur:parseFloat((10+Math.random()*14).toFixed(1)),
    delay:parseFloat((-(Math.random()*22)).toFixed(1)),
    drift:parseFloat(((Math.random()-.5)*50).toFixed(1)),
    op:parseFloat((0.06+Math.random()*0.15).toFixed(2)),
  }))).current;
  const color = isDark?"rgba(210,235,255,.75)":"rgba(140,190,230,.4)";
  return (
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:1,overflow:"hidden"}}>
      {flakes.map(f=>(
        <div key={f.id} style={{
          position:"absolute",
          left:`${f.left}%`,
          top:"-30px",
          width:f.size,
          height:f.size,
          borderRadius:"50%",
          background:color,
          opacity:f.op,
          animation:`snowDrift ${f.dur}s ${f.delay}s infinite linear`,
          willChange:"transform",
        }}/>
      ))}
    </div>
  );
});

/* ── FIX 4: Improved safeJSON with tighter parsing ── */
const safeJSON=raw=>{
  if(!raw||typeof raw!=="string")throw new Error("empty response");
  const trimmed=raw.trim();
  // Try direct parse first
  try{return JSON.parse(trimmed);}catch(e){}
  // Try extracting JSON block (handle markdown fences)
  const fenced=trimmed.replace(/^```(?:json)?\s*/,"").replace(/\s*```$/,"").trim();
  try{return JSON.parse(fenced);}catch(e){}
  // Last resort: find balanced braces
  let start=-1,depth=0,end=-1;
  for(let i=0;i<trimmed.length;i++){
    if(trimmed[i]==="{"){if(start===-1)start=i;depth++;}
    else if(trimmed[i]==="}"){depth--;if(depth===0&&start!==-1){end=i;break;}}
  }
  if(start!==-1&&end!==-1){
    try{return JSON.parse(trimmed.slice(start,end+1));}catch(e){}
  }
  throw new Error("parse fail");
};

const getDemoResponse=(userInput,lang)=>{
  const mood=detectMood(userInput);
  const category=mood==="sad"?"sad":mood==="tired"?"tired":mood==="excited"||mood==="happy"?"excited":"default";
  const resp=DEMO_RESPONSES[category][lang]||DEMO_RESPONSES[category].ko;
  // Make plans time-aware
  const hour=new Date().getHours();
  const filtered={...resp,plans:resp.plans.map(p=>{
    if(p.scope==="today"&&hour>=22)return{...p,desc:p.desc+" (내일 아침에 해도 좋아)"};
    return p;
  })};
  if(hour>=22||hour<6){
    filtered.seowooSays=(lang==="en"?"It's late — don't overthink it. Rest first, we'll figure it out tomorrow ☁️":lang==="zh"?"已经很晚了，别想太多。先休息，明天再说 ☁️":"이 시간엔 무리하지 마. 일단 쉬고 내일 같이 생각해보자 ☁️");
  }
  return filtered;
};

const callSeowoo=async({userInput,lang,mbti,contextHint,history=[]})=>{
  const langInstr=lang==="en"?"Respond entirely in English.":lang==="zh"?"请全程用中文回答。":"전부 한국어로 대답해줘.";
  const mbtiInstr=mbti==="T"?"STYLE T: 1 sentence empathy max, then immediately concrete actionable plans.":"STYLE F: 2 sentences of genuine emotional validation first, then gentle warm plans.";
  const now=new Date();
  const hour=now.getHours();
  const timeCtx=`Current local time: ${hour}:${String(now.getMinutes()).padStart(2,"0")}. ${hour<6?"Late night/early morning":hour<12?"Morning":hour<14?"Lunchtime":hour<18?"Afternoon":hour<22?"Evening":"Late night"}. ALL plans must be appropriate for AFTER this time. Never suggest plans for times already passed today.`;
  const langMusicMap={ko:"Korean",en:"English/Western",zh:"Chinese"};
  const userLangRegion=langMusicMap[lang]||"Korean";
  const SYS=`You are 서우 (Seowoo), a warm polar bear friend in the app POTD. ${langInstr} ${mbtiInstr}
${timeCtx}

You ARE Claude — one of the smartest AIs. Use that intelligence fully. Read the user's words carefully. Understand what they actually mean, what they need, what they're not saying. Then respond as their trusted friend 서우.

CORE RULES:
- Read the weight of what the user says. Serious problems get serious care. Light questions get light energy. YOU judge the tone — don't follow a formula.
- T mode: empathy is brief, go straight to actionable solutions. F mode: validate their emotions first, then gently guide to plans.
- Always respond in ${lang==="en"?"English":lang==="zh"?"Chinese":"Korean"}. ALL text — seowooSays, song reasons, genre names, plan titles/descriptions — must be in this language.
- Use casual speech (반말/casual/口语).

SONGS: Pick 3 songs that fit THIS specific situation (not generic mood playlists). Mix well-known and indie. Never repeat artists.

PLANS: Make them specific to what the user ACTUALLY said. No generic advice. Time-aware — nothing before now (${hour}:${String(now.getMinutes()).padStart(2,"0")}). YouTube links for exercise: https://www.youtube.com/results?search_query=[URL-encoded]

FOLLOW-UPS: You remember everything. Build on previous context. Go deeper.

INTENT HANDLING:
- If user asks for new/different songs: provide new songs in the songs array
- If user says they don't like a plan or want to remove it: provide replacement plans only
- If user just wants to talk more: you can return empty songs[] and plans[] arrays, just respond in seowooSays
- If user asks for both new songs AND plans: provide both

JSON ONLY. No markdown. No backticks. Start with {
{"seowooSays":"natural response","songs":[{"title":"","artist":"","reason":"","genre":"","emoji":"","color1":"#hex","color2":"#hex"}],"plans":[{"title":"","desc":"","link":"","scope":"today|week|month|year"}]}`;
  const msgs=[...history,{role:"user",content:userInput+(contextHint?`\n[ref:${contextHint}]`:"")}];
  try{
    const API_URL=typeof window!=='undefined'&&window.location.hostname==='localhost'?'/api/anthropic/v1/messages':'https://api.anthropic.com/v1/messages';
    const ak=window.POTD_API_KEY||"";
    const hdrs=ak?{"Content-Type":"application/json","x-api-key":ak,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}:{"Content-Type":"application/json"};
    const res=await fetch(API_URL,{method:"POST",headers:hdrs,body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:SYS,messages:msgs})});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const textBlock=data.content?.find(b=>b.type==="text");
    if(!textBlock||!textBlock.text)throw new Error("no text in response");
    return safeJSON(textBlock.text);
  }catch(e){
    console.log("[POTD] API unavailable, using demo mode:",e.message);
    return getDemoResponse(userInput,lang);
  }
};

const CalendarView=memo(({records,T,L,onDeleteSong,onDeletePlan})=>{
  const now=new Date();
  const [yr,setYr]=useState(now.getFullYear());
  const [mo,setMo]=useState(now.getMonth()+1);
  const [sel,setSel]=useState(null);
  const days=new Date(yr,mo,0).getDate();
  const first=new Date(yr,mo-1,1).getDay();
  const cells=Array.from({length:first+days},(_,i)=>i<first?null:i-first+1);
  const moKey=d=>d?`${yr}-${pad2(mo)}-${pad2(d)}`:null;
  const selRec=sel?records?.[moKey(sel)]:null;
  const moRecs=Object.keys(records||{}).filter(k=>k.startsWith(`${yr}-${pad2(mo)}`));
  const prevMo=()=>{
    if(mo===1){setMo(12);setYr(y=>y-1);}else{setMo(m=>m-1);}
    setSel(null);
  };
  const nextMo=()=>{
    if(mo===12){setMo(1);setYr(y=>y+1);}else{setMo(m=>m+1);}
    setSel(null);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>

/* ── FIX 2: PLANS VIEW — added todayKey to useMemo deps ── */
const PlansView=memo(({records,T,L,onToggle,editMode,onDeletePlan})=>{
  const [tab,setTab]=useState("today");
  const todayKey=todayStr();
  const todayRec=records?.[todayKey];

  const weekKeys=useMemo(()=>{
    const keys=[];
    const now=new Date();
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const k=dateStr(d);if(records?.[k])keys.unshift(k);}
    return keys;
  },[records,todayKey]);

  const monthKeys=useMemo(()=>{
    const now=new Date();
    return Object.keys(records||{}).filter(k=>k.startsWith(`${now.getFullYear()}-${pad2(now.getMonth()+1)}`)).sort();
  },[records,todayKey]);

  const empty=<div style={{color:T.textSub,fontSize:13,textAlign:"center",padding:"32px 0"}}>{L.noRecord}</div>;
  const renderDay=dk=>{
    const rec=records?.[dk];

    const parts=dk.split("-");
    const m=parseInt(parts[1]);const d=parseInt(parts[2]);

      <div key={dk} style={{marginBottom:18}}>
        <div style={{color:T.textDim,fontSize:11,marginBottom:8}}>{isT?L.today:`${m}/${d}`} · "{rec.mood||""}"</div>

              {editMode&&<div onClick={()=>onDeletePlan("confirm","plan",dk,i)} style={{cursor:"pointer",color:"#e05555",fontSize:14,padding:"4px",flexShrink:0}}>×</div>}

        ))}

        {tab==="today"&&(todayRec?renderDay(todayKey):empty)}

    </div>
  );
});

/* ── TOP PULL PANEL ── */
const TopPanel=({T,L,records,onTogglePlan,onDeleteSong,onDeletePlan})=>{
  const [open,setOpen]=useState(false);
  const [subTab,setSubTab]=useState("calendar");
  const [pullY,setPullY]=useState(0);
  const [editMode,setEditMode]=useState(false);
  const [delConfirm,setDelConfirm]=useState(null);
  const TRIGGER=60;
  const PANEL_H=400;

  /* Use refs to avoid stale closures in drag handlers */
  const dragRef=useRef({startY:null,currentPull:0,isOpen:false,dragging:false});
  useEffect(()=>{dragRef.current.isOpen=open;},[open]);

  const startDrag=(clientY)=>{
    dragRef.current.startY=clientY;
    dragRef.current.currentPull=0;
    dragRef.current.dragging=true;
  };
  const moveDrag=(clientY)=>{
    const dr=dragRef.current;
    if(dr.startY===null)return;
    const dy=clientY-dr.startY;
    let newPull=0;
    if(!dr.isOpen&&dy>0)newPull=Math.min(dy,TRIGGER+20);
    if(dr.isOpen&&dy<0)newPull=Math.max(dy,-30);
    dr.currentPull=newPull;
    setPullY(newPull);
  };
  const endDrag=()=>{
    const dr=dragRef.current;
    if(!dr.dragging)return;
    const pull=dr.currentPull;
    if(!dr.isOpen&&pull>TRIGGER)setOpen(true);
    if(dr.isOpen&&pull<-20)setOpen(false);
    dr.startY=null;
    dr.currentPull=0;
    dr.dragging=false;
    setPullY(0);
  };

  /* Touch handlers */
  const onTouchStart=(e)=>startDrag(e.touches[0].clientY);
  const onTouchMove=(e)=>moveDrag(e.touches[0].clientY);
  const onTouchEnd=()=>endDrag();

  /* Mouse handler — attaches move/up to window so drag works even if cursor leaves element */
  const onMouseDown=(e)=>{
    e.preventDefault();
    startDrag(e.clientY);
    const onMove=(mv)=>moveDrag(mv.clientY);
    const onUp=()=>{
      endDrag();
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
    };
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
  };

  const ty=open?Math.max(pullY,0):-PANEL_H+Math.max(pullY*1.1,0);
  const dragHandlers={onTouchStart,onTouchMove,onTouchEnd,onMouseDown};

  return(
    <>
      {/* Sliding panel */}
      <div style={{position:"fixed",top:0,left:0,right:0,zIndex:35,transform:`translateY(${ty}px)`,transition:pullY===0?"transform .38s cubic-bezier(.22,.88,.22,1)":"none",willChange:"transform"}}>
        <div style={{background:T.sheetBg,border:`1px solid ${T.sheetBorder}`,borderRadius:"0 0 20px 20px",padding:"14px 18px 10px",backdropFilter:"blur(22px)",height:PANEL_H,overflowY:"auto"}}>
          <div style={{display:"flex",gap:5,marginBottom:12}}>
            {[{id:"calendar",label:L.calendar},{id:"plans",label:L.plans},{id:"stats",label:L.stats}].map(t=>(
              <button key={t.id} onClick={()=>{setSubTab(t.id);setEditMode(false);}} style={{flex:1,padding:"7px 0",borderRadius:999,border:"none",cursor:"pointer",fontFamily:"inherit",background:subTab===t.id?T.navActive:"transparent",color:subTab===t.id?T.navActiveText:T.textSub,fontSize:12,fontWeight:subTab===t.id?600:400,transition:"all .15s"}}>{t.label}</button>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
            <div onClick={()=>setEditMode(e=>!e)} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"3px 8px",borderRadius:8,background:editMode?T.accentBg:"transparent",border:editMode?"1px solid "+T.accent+"44":"1px solid transparent",transition:"all .2s"}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={editMode?T.accent:T.textSub} strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
          </div>
          {subTab==="calendar"&&<CalendarView records={records} T={T} L={L} onDeleteSong={editMode?function(a,b,c,d){setDelConfirm({type:b,dk:c,idx:d})}:null} onDeletePlan={editMode?function(a,b,c,d){setDelConfirm({type:b,dk:c,idx:d})}:null}/>}
          {subTab==="plans"&&<PlansView records={records} T={T} L={L} onToggle={onTogglePlan} editMode={editMode} onDeletePlan={function(a,b,c,d){setDelConfirm({type:b,dk:c,idx:d})}}/>}
          {subTab==="stats"&&<StatsPanel records={records} T={T} L={L}/>}
        </div>
          {delConfirm&&(
            <div style={{position:"absolute",inset:0,zIndex:40,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.4)",borderRadius:"0 0 20px 20px"}}>
              <div style={{background:T.sheetBg,border:"1px solid "+T.sheetBorder,borderRadius:14,padding:"18px 20px",maxWidth:220,textAlign:"center",animation:"popIn .2s ease both"}}>
                <p style={{color:T.text,fontSize:13,marginBottom:16}}>{delConfirm.type==="song"?(L.deleteSong||"Delete this song?"):(L.deletePlan||"Delete this plan?")}</p>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setDelConfirm(null)} style={{flex:1,padding:"8px",background:"transparent",border:"1px solid "+T.cardBorder,borderRadius:8,color:T.textSub,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{L.resetNo||"No"}</button>
                  <button onClick={()=>{if(delConfirm.type==="song")onDeleteSong(delConfirm.dk,delConfirm.idx);else onDeletePlan(delConfirm.dk,delConfirm.idx);setDelConfirm(null);}} style={{flex:1,padding:"8px",background:"#e05555",border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{L.resetYes||"Yes"}</button>
                </div>
              </div>
            </div>
          )}
        {/* Visible drag handle — compact */}
        <div {...dragHandlers}
          style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"4px 0 3px",cursor:"grab",background:T.sheetBg,borderRadius:"0 0 10px 10px",boxShadow:"0 4px 14px rgba(0,0,0,.14)",touchAction:"none",userSelect:"none"}}>
          <div style={{width:32,height:3,borderRadius:2,background:T.handleBg}}/>
          {!open&&<svg width="10" height="6" viewBox="0 0 10 6" style={{marginTop:2,opacity:.3,animation:"shimmer 2.5s ease-in-out infinite"}}><path d="M1 1l4 4 4-4" stroke={T.accent} strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>}
        </div>
      </div>

      {/* Wider invisible drag zone at top — mouse + touch, sits BELOW panel (zIndex 34) so handle isn't blocked */}
      {!open&&<div {...dragHandlers}
        style={{position:"fixed",top:0,left:0,right:0,height:14,zIndex:34,touchAction:"none",cursor:"grab"}}/>}

      {/* Backdrop when open */}
      {open&&<div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:34,background:"rgba(0,0,0,.3)"}}/>}
    </>
  );
};

/* ══════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════ */
function POTD(){
  const [themeKey,setThemeKey]=useState("dark");
  const [langKey,setLangKey]=useState("ko");
  const [mbti,setMbti]=useState("F");
  const T=themeKey==="dark"?DARK:LIGHT;
  const L=I18N[langKey]||I18N.ko;

  const [screen,setScreen]=useState("home");
  const [records,setRecords]=useState({});
  const [mood,setMood]=useState("");
  const [input,setInput]=useState("");
  const [songs,setSongs]=useState([]);
  const [plans,setPlans]=useState([]);
  const [plansDone,setPlansDone]=useState([]);
  const [smsg,setSmsg]=useState("");
  const [bearMood,setBearMood]=useState("idle");
  const [prevMood,setPrevMood]=useState(null);
  const [show,setShow]=useState(false);
  const [errMsg,setErrMsg]=useState("");
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [inputOpen,setInputOpen]=useState(false);
  const [convHistory,setConvHistory]=useState([]);
  const [followUpInput,setFollowUpInput]=useState("");
  const [followUpLoading,setFollowUpLoading]=useState(false);
  const [planHistory,setPlanHistory]=useState([]); // array of {plans,plansDone} for swipe
  const [planPage,setPlanPage]=useState(0); // 0=current, 1,2,...=older
  const [resetOpen,setResetOpen]=useState(false);
  const [firstTime,setFirstTime]=useState(true);
  const inputRef=useRef(null);
  const showTimer=useRef(null);

  /* Font loading — inject <link> into head for reliable CDN font loading */
  useEffect(()=>{
    const fontURLs=[
      'https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap',
      'https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/subsets/Cafe24Ssurround-dynamic-subset.css',
    ];
    const links=fontURLs.map(url=>{
      const existing=document.querySelector(`link[href="${url}"]`);
      if(existing)return null;
      const link=document.createElement('link');
      link.rel='stylesheet';
      link.href=url;
      document.head.appendChild(link);
      return link;
    });
    return()=>links.forEach(l=>l&&l.parentNode&&l.parentNode.removeChild(l));
  },[]);

  /* FIX 3: Added .catch() and FIX 5: cleanup on unmount */
  useEffect(()=>{
    Promise.all([DB.get("records"),DB.get("theme"),DB.get("lang"),DB.get("mbti")]).then(([r,th,ln,mb])=>{
      if(r){
        setRecords(r);
        const y=new Date();y.setDate(y.getDate()-1);
        const yk=dateStr(y);
        if(r[yk]&&r[yk].mood)setPrevMood(r[yk].mood);
      }
      if(th)setThemeKey(th);
      if(ln)setLangKey(ln);
      if(mb)setMbti(mb);
    }).catch(()=>{});
    const initTimer=setTimeout(()=>setShow(true),100);
    return()=>{
      clearTimeout(initTimer);
      if(showTimer.current)clearTimeout(showTimer.current);
    };
  },[]);

  const goTo=useCallback((nextScreen,resetAll=false)=>{
    setShow(false);
    if(showTimer.current)clearTimeout(showTimer.current);
    showTimer.current=setTimeout(()=>{
      if(resetAll){
        setInput("");setMood("");setSongs([]);setPlans([]);
        setSmsg("");setBearMood("idle");setErrMsg("");
        setConvHistory([]);setFollowUpInput("");setInputOpen(false);
        setPlanHistory([]);setPlanPage(0);
      }
      setScreen(nextScreen);
      showTimer.current=setTimeout(()=>setShow(true),60);
    },260);
  },[]);

  const goHome=useCallback(()=>goTo("home",true),[goTo]);

  const handleReset=async()=>{
    setResetOpen(false);
    var today=todayStr();
    if(records[today]){
      var updated={};for(var k in records){if(k!==today)updated[k]=records[k];}
      setRecords(updated);
      await DB.set("records",updated);
    }
    goTo("home",true);
  };

  const handleBubbleClick=()=>{
    setInputOpen(o=>!o);
    setTimeout(()=>inputRef.current&&inputRef.current.focus(),100);
  };

  const handleSubmit=async()=>{
    if(!input.trim())return;
    const userInput=input.trim();
    setMood(userInput);setErrMsg("");setBearMood("thinking");setInputOpen(false);
    goTo("loading");
    const ctx=Object.keys(records).sort().slice(-3).map(k=>records[k]&&records[k].mood).filter(Boolean).join(", ");
    try{
      const parsed=await callSeowoo({userInput,lang:langKey,mbti,contextHint:ctx});
      const ns=Array.isArray(parsed.songs)?parsed.songs:[];
      const np=Array.isArray(parsed.plans)?parsed.plans:[];
      const nm=parsed.seowooSays||"오늘도 잘 해봐.";
      const nd=new Array(np.length).fill(false);
      setSongs(ns);setPlans(np);setPlansDone(nd);setSmsg(nm);
      setBearMood(detectMood(userInput));
      setConvHistory([{role:"user",content:userInput},{role:"assistant",content:nm}]);
      const rec={date:todayStr(),mood:userInput,seowooMsg:nm,songs:ns,plans:np,plansDone:nd,savedAt:Date.now()};
      const updated={...records,[todayStr()]:rec};
      setRecords(updated);
      await DB.set("records",updated);
      setInput("");
      goTo("result");
    }catch(e){
      setErrMsg(L.errMsg);setBearMood("idle");
      goTo("home");
    }
  };

  /* FIX 6: handleFollowUp — shows loading, keeps songs, pushes old plans to history */
  const handleFollowUp=async()=>{
    if(!followUpInput.trim()||followUpLoading)return;
    const q=followUpInput.trim();
    setFollowUpLoading(true);setFollowUpInput("");setInputOpen(false);
    // Show loading screen
    setShow(false);
    await new Promise(r=>setTimeout(r,200));
    setScreen("loading");
    setShow(true);
    try{
      const parsed=await callSeowoo({userInput:q,lang:langKey,mbti,contextHint:`Original mood: "${mood}". This is follow-up #${Math.floor(convHistory.length/2)+1}. Build upon previous conversation — deepen analysis, refine plans. Only include new plans. Do NOT include songs unless user specifically asks for music.`,history:convHistory});
      const np=Array.isArray(parsed.plans)&&parsed.plans.length>0?parsed.plans:plans;
      const nm=parsed.seowooSays||smsg;
      const nd=new Array(np.length).fill(false);
      // Push current plans to history before replacing (only if different)
      if(plans.length>0&&np!==plans){
        setPlanHistory(h=>[...h,{plans:[...plans],plansDone:[...plansDone]}]);
      }
      // Only update songs if user asked about music
      if(Array.isArray(parsed.songs)&&parsed.songs.length>0){
        setSongs(parsed.songs);
      }
      setPlans(np);setPlansDone(nd);setSmsg(nm);setPlanPage(0);
      setConvHistory(h=>[...h,{role:"user",content:q},{role:"assistant",content:nm}]);
      const existing=records[todayStr()]||{};
      const allPlans=[...np,...(existing.plans||[])];
      const allPlansDone=[...nd,...(existing.plansDone||[])];
      const updated={...records,[todayStr()]:{
        ...existing,
        date:existing.date||todayStr(),
        mood:existing.mood||mood,
        savedAt:existing.savedAt||Date.now(),
        seowooMsg:nm,songs:wantsMusic&&Array.isArray(parsed.songs)?parsed.songs:existing.songs||songs,
        plans:allPlans,plansDone:allPlansDone
      }};
      setRecords(updated);await DB.set("records",updated);
    }catch(e){
      console.log("[POTD] Follow-up error:",e.message);
    }
    setFollowUpLoading(false);
    // Return to result screen
    setShow(false);
    await new Promise(r=>setTimeout(r,200));
    setScreen("result");
    setShow(true);
  };

  const togglePlan=async(dk,idx)=>{
    const rec=records[dk];if(!rec)return;
    const nd=[...(rec.plansDone||[])];nd[idx]=!nd[idx];
    const updated={...records,[dk]:{...rec,plansDone:nd}};
    if(dk===todayStr())setPlansDone(nd);
    setRecords(updated);await DB.set("records",updated);
  };

  const deleteSong=async(dk,idx)=>{
    const rec=records[dk];if(!rec)return;
    const ns=[...(rec.songs||[])];ns.splice(idx,1);
    const updated={...records,[dk]:{...rec,songs:ns}};
    if(dk===todayStr())setSongs(ns);
    setRecords(updated);await DB.set("records",updated);
  };

  const deletePlan=async(dk,idx)=>{
    const rec=records[dk];if(!rec)return;
    const np=[...(rec.plans||[])];np.splice(idx,1);
    const nd=[...(rec.plansDone||[])];nd.splice(idx,1);
    const updated={...records,[dk]:{...rec,plans:np,plansDone:nd}};
    if(dk===todayStr()){setPlans(np);setPlansDone(nd);}
    setRecords(updated);await DB.set("records",updated);
  };

  const saveSettings=async(ln,th,mb)=>{
    await Promise.all([DB.set("theme",th),DB.set("lang",ln),DB.set("mbti",mb)]);
  };

  const FONT_BY_LANG={
    ko:"'Jua','Quicksand',system-ui,sans-serif",
    en:"'Baloo 2','Quicksand',system-ui,sans-serif",
    zh:"'ZCOOL KuaiLe','Quicksand',system-ui,'PingFang SC','Microsoft YaHei',sans-serif",
  };
  const isHome=screen==="home";
  const isResult=screen==="result";
  const isLoading=screen==="loading";

  return(
    <div style={{minHeight:"100vh",background:`linear-gradient(158deg,${T.bg} 0%,${T.bg2} 55%,${T.bg3} 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",fontFamily:FONT_BY_LANG[langKey]||FONT_BY_LANG.ko,transition:"background .4s ease"}}>
      {/* FIX 1: snowDrift keyframe — no opacity animation, preserves inline opacity */}
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0;}
        ::-webkit-scrollbar{display:none;}
        input::placeholder{color:rgba(100,150,180,.3);}
        @keyframes bearFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
        @keyframes popIn{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
        @keyframes blink{0%,80%,100%{opacity:.18}40%{opacity:.7}}
        @keyframes shimmer{0%,100%{opacity:.18}50%{opacity:.38}}
        @keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes snowDrift{0%{transform:translateY(-30px) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg)}}
        @keyframes curiousTilt{0%{transform:translateY(0) rotate(0deg) scale(1)}30%{transform:translateY(-6px) rotate(-4deg) scale(1.08)}60%{transform:translateY(-3px) rotate(2deg) scale(1.06)}100%{transform:translateY(0) rotate(0deg) scale(1.05)}}
        button:focus,a:focus{outline:none;}
      `}</style>

      <Snow isDark={themeKey==="dark"}/>
      <div style={{position:"absolute",top:"38%",left:"50%",transform:"translate(-50%,-50%)",width:420,height:420,borderRadius:"50%",pointerEvents:"none",background:`radial-gradient(circle,${themeKey==="dark"?"rgba(28,68,130,.07)":"rgba(80,150,220,.05)"} 0%,transparent 70%)`}}/>

      <TopPanel T={T} L={L} records={records} onTogglePlan={togglePlan} onDeleteSong={deleteSong} onDeletePlan={deletePlan}/>

      {!(isResult&&inputOpen)&&<button onClick={()=>setSettingsOpen(true)} style={{position:"fixed",top:20,right:16,zIndex:30,background:T.tagBg,border:`1px solid ${T.cardBorder}`,borderRadius:9,padding:"8px",color:T.accent,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",width:34,height:34}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>}

      {/* Reset button — left of settings */}
      {isResult&&!inputOpen&&(
        <button onClick={()=>setResetOpen(true)} style={{position:"fixed",top:20,right:58,zIndex:30,background:T.tagBg,border:`1px solid ${T.cardBorder}`,borderRadius:9,padding:"8px",color:T.textSub,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",width:34,height:34}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
      )}

      {/* Reset confirmation dialog */}
      {resetOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:55,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setResetOpen(false)}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.42)"}}/>
          <div onClick={e=>e.stopPropagation()} style={{position:"relative",background:T.sheetBg,border:`1px solid ${T.sheetBorder}`,borderRadius:18,padding:"24px 22px 20px",backdropFilter:"blur(22px)",animation:"popIn .25s ease both",maxWidth:260,textAlign:"center"}}>
            <div style={{marginBottom:18}}>
              <PolarBear size={64} mood="sad"/>
            </div>
            <p style={{color:T.text,fontSize:13,lineHeight:1.7,marginBottom:20,whiteSpace:"pre-line"}}>{L.resetConfirm}</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setResetOpen(false)} style={{flex:1,padding:"10px",background:"transparent",border:`1px solid ${T.cardBorder}`,borderRadius:10,color:T.textSub,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{L.resetNo}</button>
              <button onClick={handleReset} style={{flex:1,padding:"10px",background:T.btnPrimary,border:"none",borderRadius:10,color:T.btnText,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{L.resetYes}</button>
            </div>
          </div>
        </div>
      )}

      {isResult&&!inputOpen&&(
        <button onClick={goHome} style={{position:"fixed",top:20,left:16,zIndex:30,background:T.tagBg,border:`1px solid ${T.cardBorder}`,borderRadius:9,padding:"8px",color:T.textSub,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",width:34,height:34}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
      )}

      <div style={{transition:"opacity .3s ease, transform .3s ease",opacity:show?1:0,transform:show?"translateY(0)":"translateY(10px)",display:"flex",flexDirection:"column",alignItems:"center",zIndex:10,width:"100%",maxWidth:400,padding:"64px 18px 50px",overflowY:"auto",maxHeight:"100vh"}}>

        {isHome&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:0,width:"100%"}}>
            <div style={{animation:"popIn .4s ease .2s both",marginBottom:inputOpen?12:22,cursor:"pointer",width:"100%",maxWidth:280,display:"flex",justifyContent:"center"}} onClick={handleBubbleClick}>
              <SpeechBubble text={L.greeting(prevMood)} T={T} style={{cursor:"pointer"}}/>
            </div>
            <div style={{width:"100%",maxWidth:280,maxHeight:inputOpen?120:0,overflow:"hidden",transition:"max-height .35s cubic-bezier(.22,.88,.22,1),opacity .25s ease",opacity:inputOpen?1:0,marginBottom:inputOpen?10:0}}>
              <div style={{background:T.inputPanel,border:`1.5px solid ${T.inputBorder}`,borderRadius:16,padding:"12px 14px",backdropFilter:"blur(16px)"}}>
                <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")handleSubmit();}} placeholder={L.placeholder}
                  style={{width:"100%",background:"transparent",border:"none",color:T.text,fontSize:14,outline:"none",fontFamily:"inherit",marginBottom:9}}/>
                <button onClick={handleSubmit} style={{width:"100%",padding:"9px",background:T.btnPrimary,border:"none",borderRadius:11,color:T.btnText,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                  {L.submitBtn}
                </button>
              </div>
            </div>
            <div style={{animation:"bearFloat 5s ease-in-out infinite"}}>
              <PolarBear size={210} mood="idle"/>
            </div>
            {errMsg&&<div style={{color:"#e05555",fontSize:12,marginTop:10,textAlign:"center"}}>{errMsg}</div>}
            {!inputOpen&&<div style={{marginTop:20,color:T.textDim,fontSize:11,letterSpacing:".1em",animation:"shimmer 3s ease-in-out infinite"}}>{L.touchStart}</div>}
          </div>
        )}

        {isLoading&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
            <div style={{animation:"popIn .3s ease both",marginBottom:12,display:"flex",justifyContent:"center"}}>
              <SpeechBubble text={followUpLoading?L.followUpLoading:L.loadingBubble} T={T}/>
            </div>
            <div style={{animation:"bearFloat 5s ease-in-out infinite"}}>
              <PolarBear size={180} mood="thinking"/>
            </div>
          </div>
        )}

        {isResult&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:"100%",paddingTop:inputOpen?0:8}}>
            {/* Seowoo speech bubble — shows comfort msg or follow-up ask */}
            <div style={{animation:"popIn .38s ease both",marginBottom:inputOpen?8:14,marginTop:inputOpen?0:36,width:"100%",display:"flex",justifyContent:"center",cursor:"pointer"}} onClick={handleBubbleClick}>
              <SpeechBubble text={inputOpen?L.followUpAsk:smsg} T={T} style={{cursor:"pointer",maxWidth:180,fontSize:12}}/>
            </div>

            {/* Follow-up input */}
            <div style={{width:"100%",maxWidth:300,maxHeight:inputOpen?90:0,overflow:"visible",transition:"max-height .32s cubic-bezier(.22,.88,.22,1),opacity .25s ease",opacity:inputOpen?1:0,marginBottom:inputOpen?12:0}}>
              <div style={{background:T.inputPanel,border:`1.5px solid ${T.inputBorder}`,borderRadius:14,padding:"10px 13px",display:"flex",gap:8,backdropFilter:"blur(16px)",width:"100%",boxSizing:"border-box"}}>
                <input ref={inputRef} value={followUpInput} onChange={e=>setFollowUpInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")handleFollowUp();}} placeholder={L.followUp}
                  style={{flex:1,background:"transparent",border:"none",color:T.text,fontSize:13,outline:"none",fontFamily:"inherit"}}/>
                <button onClick={handleFollowUp} disabled={followUpLoading} style={{padding:"6px 13px",background:T.btnPrimary,border:"none",borderRadius:10,color:T.btnText,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:followUpLoading?.6:1,flexShrink:0}}>
                  {followUpLoading?"…":L.send}
                </button>
              </div>
            </div>

            {/* Seowoo bear — bigger + curious tilt when follow-up mode */}
            <div style={{animation:inputOpen?"curiousTilt .6s ease forwards":"bearFloat 5s ease-in-out infinite",marginBottom:inputOpen?6:10,transition:"all .3s ease"}} onClick={!inputOpen?handleBubbleClick:undefined}>
              <PolarBear size={inputOpen?160:128} mood="idle"/>
            </div>

            {/* Content below — hidden during follow-up mode for focus */}
            {!inputOpen&&<>
              <div style={{padding:"3px 12px",borderRadius:999,marginBottom:14,background:T.tagBg,border:`1px solid ${T.tagBorder}`}}>
                <span style={{color:T.textSub,fontSize:11}}>{L.moodLabel}  </span>
                <span style={{color:T.tagText,fontSize:12,fontWeight:600}}>"{mood}"</span>
              </div>
              <div style={{width:"100%",marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2" strokeLinecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span style={{color:T.accent,fontSize:11,fontWeight:600,letterSpacing:".1em",textTransform:"uppercase"}}>{L.music}</span></div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {songs.map((s,i)=>(
                    <div key={i} style={{animation:`fadeUp .28s ease ${i*0.09}s both`}}>
                      <SongCard song={s} T={T}/>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{width:"60%",height:1,background:T.divider,margin:"4px auto 18px"}}/>
              <div style={{width:"100%"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span style={{color:T.accent,fontSize:11,fontWeight:600,letterSpacing:".1em",textTransform:"uppercase"}}>{L.plan}</span></div>
                  {planHistory.length>0&&(
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <div onClick={()=>setPlanPage(p=>Math.min(p+1,planHistory.length))} style={{cursor:"pointer",color:T.accent,fontSize:14,opacity:planPage<planHistory.length?.8:.2}}>‹</div>
                      {planHistory.map((_,i)=>(
                        <div key={i} onClick={()=>setPlanPage(i+1)} style={{width:6,height:6,borderRadius:"50%",background:planPage===i+1?T.accent:T.cardBorder,cursor:"pointer",transition:"background .2s"}}/>
                      ))}
                      <div onClick={()=>setPlanPage(0)} style={{width:6,height:6,borderRadius:"50%",background:planPage===0?T.accent:T.cardBorder,cursor:"pointer",transition:"background .2s"}}/>
                      <div onClick={()=>setPlanPage(p=>Math.max(p-1,0))} style={{cursor:"pointer",color:T.accent,fontSize:14,opacity:planPage>0?.8:.2}}>›</div>
                    </div>
                  )}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {planPage===0?
                    plans.map((p,i)=>(
                      <PlanItem key={i} plan={p} done={plansDone[i]} onToggle={()=>togglePlan(todayStr(),i)} T={T} L={L} delay={i*0.1+0.15}/>
                    ))
                    :planHistory[planPage-1]&&planHistory[planPage-1].plans.map((p,i)=>(
                      <PlanItem key={i} plan={p} done={(planHistory[planPage-1].plansDone||[])[i]} onToggle={null} T={T} L={L} delay={i*0.08}/>
                    ))
                  }
                </div>
              </div>
            </>}
          </div>
        )}
      </div>

      <div style={{position:"fixed",bottom:14,left:"50%",transform:"translateX(-50%)",color:T.watermark,zIndex:5,pointerEvents:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
        <span style={{fontSize:11,fontWeight:700,letterSpacing:".22em"}}>POTD</span>
        <span style={{fontSize:8,letterSpacing:".1em",opacity:.6}}>Plan Of The Day</span>
      </div>

      {firstTime&&!isLoading&&!isResult&&(
        <div onClick={()=>setFirstTime(false)} style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.55)",cursor:"pointer"}}>
          <div style={{background:T.sheetBg,border:"1px solid "+T.sheetBorder,borderRadius:20,padding:"28px 24px 22px",maxWidth:270,textAlign:"center",backdropFilter:"blur(16px)",animation:"popIn .4s ease .2s both"}}>
            <PolarBear size={72} mood="excited"/>
            <p style={{color:T.text,fontSize:14,fontWeight:600,marginTop:12,marginBottom:6}}>{langKey==="en"?"Hi! I'm Seowoo":langKey==="zh"?"\u563f\uff01\u6211\u662f\u5c0f\u96ea":"안녕! 나는 서우야"}</p>
            <p style={{color:T.textSub,fontSize:12,lineHeight:1.7,marginBottom:16}}>{langKey==="en"?"Tell me how you feel, and I'll make a plan with music just for you.":langKey==="zh"?"\u544a\u8bc9\u6211\u4f60\u7684\u5fc3\u60c5\uff0c\u6211\u4f1a\u4e3a\u4f60\u5236\u5b9a\u8ba1\u5212\u548c\u97f3\u4e50\u63a8\u8350\u3002":"기분을 알려주면 음악이랑 오늘의 플랜을 만들어줄게."}</p>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14,textAlign:"left"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:22,height:22,borderRadius:999,background:T.accentBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:10,color:T.accent,fontWeight:700}}>1</span></div>
                <span style={{color:T.text,fontSize:11}}>{langKey==="en"?"Tap the speech bubble":langKey==="zh"?"\u70B9\u51FB\u5BF9\u8BDD\u6846":"말풍선을 터치해줘"}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:22,height:22,borderRadius:999,background:T.accentBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:10,color:T.accent,fontWeight:700}}>2</span></div>
                <span style={{color:T.text,fontSize:11}}>{langKey==="en"?"Tell me how you feel":langKey==="zh"?"\u544A\u8BC9\u6211\u4F60\u7684\u5FC3\u60C5":"기분을 적어줘"}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:22,height:22,borderRadius:999,background:T.accentBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:10,color:T.accent,fontWeight:700}}>3</span></div>
                <span style={{color:T.text,fontSize:11}}>{langKey==="en"?"Get music + plan for today":langKey==="zh"?"\u83B7\u53D6\u97F3\u4E50+\u8BA1\u5212":"음악이랑 플랜을 받아줘"}</span>
              </div>
            </div>
            <div style={{color:T.textDim,fontSize:10,letterSpacing:".08em",animation:"shimmer 2.5s ease-in-out infinite"}}>{langKey==="en"?"Tap anywhere to start":langKey==="zh"?"\u70B9\u51FB\u4EFB\u610F\u5904\u5F00\u59CB":"아무 곳이나 터치해서 시작"}</div>
          </div>
        </div>
      )}
      {settingsOpen&&<SettingsPanel T={T} L={L} lang={langKey} setLang={setLangKey} themeKey={themeKey} setThemeKey={setThemeKey} mbti={mbti} setMbti={setMbti} onClose={()=>setSettingsOpen(false)} onSave={saveSettings}/>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<POTD/>);
</script>
</body>
</html>
